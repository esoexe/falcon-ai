    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="820" y1="0" x2="820" y2="320"/>
    <line x1="980" y1="0" x2="980" y2="320"/>
  </g>
  <!-- 3D Quad-Mesh Wireframe Sphere / Emblem on Right -->
  <g transform="translate(1010,160)" fill="none" stroke-width="1.4">
    <circle r="102" stroke="#2a3142" stroke-dasharray="4 4"/>
    <ellipse rx="96" ry="38" stroke="#38bdf8" stroke-opacity="0.65"/>
    <ellipse rx="38" ry="96" stroke="#38bdf8" stroke-opacity="0.65"/>
    <polygon points="0,-92 78,-34 62,68 -62,68 -78,-34" stroke="#f8fafc" stroke-opacity="0.85"/>
    <polygon points="0,-54 46,-18 34,42 -34,42 -46,-18" stroke="#f59e0b" stroke-opacity="0.85"/>
    <line x1="0" y1="-92" x2="0" y2="-54" stroke="#64748b"/>
    <line x1="78" y1="-34" x2="46" y2="-18" stroke="#64748b"/>
    <line x1="62" y1="68" x2="34" y2="42" stroke="#64748b"/>
    <line x1="-62" y1="68" x2="-34" y2="42" stroke="#64748b"/>
    <line x1="-78" y1="-34" x2="-46" y2="-18" stroke="#64748b"/>
  </g>
  <!-- Left Typography -->
  <rect x="48" y="42" width="38" height="38" rx="8" fill="#f8fafc"/>
  <text x="67" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="800" fill="#0b0c10" text-anchor="middle">F</text>
  <rect x="98" y="47" width="236" height="28" rx="6" fill="#181b24" stroke="#303646"/>
  <text x="216" y="65" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">RELEASE v3.0.0 · MESHY PARITY</text>

  <text x="48" y="138" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="52" font-weight="800" fill="#f8fafc" letter-spacing="-1.2">Falcon AI Studio v3.0</text>
  <text x="48" y="176" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18.5" fill="#94a3b8">Open-Source C++20 3D Sculptor, Quad Remesher, 4K PBR Baker, 24-Clip Auto-Rigger &amp; 3D Game Engine</text>

  <rect x="48" y="198" width="730" height="3" rx="1.5" fill="url(#accent)"/>

